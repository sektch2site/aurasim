name: Проверка сессии партнёрки

on:
  schedule:
    - cron: "43 */2 * * *" # каждые 2 часа
  workflow_dispatch: {}

concurrency:
  group: partner
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types scripts/sync-partner.ts check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEBUG_PARTNER: "1"
